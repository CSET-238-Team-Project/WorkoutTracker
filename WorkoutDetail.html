<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Workout Detail</title>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="WorkoutDetail.css" />
    </head>
    <body>
        <div id="app">
            <nav id="top-nav">
                <button id="back-button" aria-label="Go back" onclick="window.history.back()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h1 id="workout-title">Default Title</h1>
            </nav>

            <div id="workout-summary">
                <span id="info-exercises">Default Exercise</span>
                <span id="info-time">Default Time</span>
            </div>

            <div id="exercise-list"></div>
        </div>

        <div id="bottom-buttons">
            <button id="edit-button">Edit</button>
            <button id="start-button" onclick="startWorkout()">Start</button>
        </div>

        <script src="WorkoutDetail.js"></script>
    </body>
</html>

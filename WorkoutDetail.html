<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <META charset="UTF-8" />
        <META name="viewport" content="width=device-width, initial-scale=1.0" />
        <TITLE>Workout Detail</TITLE>
        <LINK href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
        <LINK rel="stylesheet" href="WorkoutDetail.css" />
    </HEAD>
    <BODY>
        <DIV id="app">
            <nav id="top-nav">
                <button id="back-button" aria-label="Go back" onclick="goBack()"></button>
                <h1 id="workout-title">Upper Day</h1>
            </nav>

        <DIV id="workout-summary">
            <SPAN id="info-exercises"># exercises</SPAN>
            <SPAN id="info-time">~1 hr 30 min</SPAN>
            <SPAN id="info-volume">10,000lbs</SPAN>
        </DIV>

        <DIV id="exercise-list">

            <DIV class="exercise-card">
                <DIV class="card-title">Incline Bench Press (Smith Machine)</DIV>
                <TABLE class="sets-table">
                    <THEAD>
                        <TR>
                            <TH>Set</TH>
                            <TH>Reps</TH>
                            <TH>Weight</TH>
                        </TR>
                    </THEAD>
                    <TBODY>
                        <TR>
                            <TD class="set-num">1</TD>
                            <TD>8</TD>
                            <TD>135 lbs</TD>
                        </TR>
                        <TR>
                            <TD class="set-num">2</TD>
                            <TD>8</TD>
                            <TD>135 lbs</TD>
                        </TR>
                    </TBODY>
                </TABLE>
            </DIV>

        </DIV>
        </DIV>

        <DIV id="bottom-buttons">
            <BUTTON id="edit-button">Edit</BUTTON>
            <BUTTON id="start-button">Start</BUTTON>
        </DIV>


    </BODY>
</HTML>

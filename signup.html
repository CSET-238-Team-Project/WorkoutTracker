<html>
    <head>
        <title>Sign up</title>
        <style>
            /* css for sign up page here */
        </style>
    </head>
    <body>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <button id="signupBtn">Sign Up</button>

        <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "workouttracker-f174d.firebaseapp.com",
            projectId: "workouttracker-f174d",
            storageBucket: "workouttracker-f174d.firebasestorage.app",
            messagingSenderId: "984311835015",
            appId: "1:984311835015:web:fcd67f664b9de2f34a4b22",
            measurementId: "G-1GPW2LQJ4Z"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById("signupBtn").addEventListener("click", async () => {

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {

                // Create account
                const userCredential =
                    await createUserWithEmailAndPassword(auth, email, password);

                const user = userCredential.user;

                // Store user data in Firestore
                await setDoc(doc(db, "users", user.uid), {
                    email: email,
                    workoutsThisWeek: 0,
                    createdAt: new Date()
                });

                alert("Account created!");

                console.log(user);

            } catch (error) {

                console.error(error);
                alert(error.message);

            }
        });

        </script>
    </body>
</html>

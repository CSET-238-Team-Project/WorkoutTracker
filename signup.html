<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sign Up</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background:#000;
        color:white;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .signup-container{
        width:100%;
        max-width:420px;
    }

    .logo{
        text-align:center;
        margin-bottom:40px;
    }

    .logo h1{
        font-size:42px;
        font-weight:700;
        margin-bottom:10px;
    }

    .logo p{
        color:#8a8a8a;
        font-size:15px;
    }

    .signup-card{
        background:#111;
        border:1px solid #1f1f1f;
        border-radius:28px;
        padding:28px;
    }

    .section-title{
        font-size:28px;
        font-weight:700;
        margin-bottom:25px;
    }

    .input-group{
        margin-bottom:20px;
    }

    .input-group label{
        display:block;
        margin-bottom:10px;
        font-size:14px;
        color:#bdbdbd;
    }

    .input-group input{
        width:100%;
        height:58px;
        background:#1a1a1a;
        border:1px solid #2a2a2a;
        border-radius:18px;
        padding:0 18px;
        color:white;
        font-size:16px;
        outline:none;
        transition:0.2s;
    }

    .input-group input:focus{
        border-color:#6d95ea;
    }

    .signup-btn{
        width:100%;
        height:60px;
        border:none;
        border-radius:20px;
        background:#6d95ea;
        color:white;
        font-size:18px;
        font-weight:700;
        cursor:pointer;
        margin-top:10px;
        transition:0.2s;
    }

    .signup-btn:hover{
        opacity:0.9;
    }

    .divider{
        display:flex;
        align-items:center;
        margin:28px 0;
        color:#666;
        font-size:14px;
    }

    .divider::before,
    .divider::after{
        content:"";
        flex:1;
        height:1px;
        background:#222;
    }

    .divider span{
        padding:0 15px;
    }

    .social-btn{
        width:100%;
        height:56px;
        background:#1a1a1a;
        border:1px solid #2a2a2a;
        border-radius:18px;
        color:white;
        font-size:16px;
        font-weight:600;
        margin-bottom:14px;
        cursor:pointer;
        transition:0.2s;
    }

    .social-btn:hover{
        background:#222;
    }

    .bottom-text{
        text-align:center;
        margin-top:25px;
        color:#8a8a8a;
        font-size:14px;
    }

    .bottom-text a{
        color:#6d95ea;
        text-decoration:none;
        font-weight:600;
    }
</style>
</head>

<body>

<div class="signup-container">

    <div class="logo">
        <h1>FitTrack</h1>
        <p>Create your account and start training</p>
    </div>

    <div class="signup-card">

        <div class="section-title">
            Sign Up
        </div>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" id="name">
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" id="email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Create a password" id="password">
        </div>

        <button class="signup-btn" id="signupBtn">
            Create Account
        </button>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="bottom-text">
            Already have an account?
            <a href="login.html">Log In</a>
        </div>

    </div>

</div>
    <script src="signup.js" type="module"></script>
</body>
</html>

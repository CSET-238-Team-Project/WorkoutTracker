<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <title>Account Page</title>

        <style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family: Arial, Helvetica, sans-serif;
            }

            body{
                background:#000;
                color:white;
                display:flex;
                justify-content:center;
                padding:30px 15px;
            }

            .container{
                width:100%;
                max-width:420px;
            }

            h1{
                font-size:38px;
                margin-bottom:25px;
                font-weight:700;
            }

            .card{
                background:#111;
                border:1px solid #1f1f1f;
                border-radius:24px;
                padding:25px;
                margin-bottom:22px;
            }

            .profile-section{
                display:flex;
                flex-direction:column;
                align-items:center;
                text-align:center;
            }

            .profile-pic{
                width:110px;
                height:110px;
                border-radius:50%;
                overflow:hidden;
                border:3px solid #222;
                margin-bottom:18px;
            }

            .profile-pic img{
                width:100%;
                height:100%;
                object-fit:cover;
            }

            .username{
                font-size:26px;
                font-weight:700;
                margin-bottom:8px;
            }

            .subtext{
                color:#8a8a8a;
                font-size:14px;
            }

            .section-title{
                font-size:22px;
                font-weight:700;
                margin-bottom:18px;
            }

            .progress-top{
                display:flex;
                justify-content:space-between;
                margin-bottom:14px;
                color:#bdbdbd;
                font-size:14px;
            }

            .progress-bar{
                width:100%;
                height:16px;
                background:#1f1f1f;
                border-radius:999px;
                overflow:hidden;
            }

            .progress-fill{
                height:100%;
                background:#6d95ea;
                border-radius:999px;
            }

            .button{
                width:100%;
                height:60px;
                border:none;
                border-radius:20px;
                font-size:18px;
                font-weight:700;
                cursor:pointer;
                margin-bottom:18px;
                transition:0.2s;
            }

            .settings-btn{
                background:#111;
                color:white;
                border:1px solid #222;
            }

            .settings-btn:hover{
                background:#1a1a1a;
            }

            .signout-btn{
                background:#6d95ea;
                color:white;
            }

            .signout-btn:hover{
                opacity:0.9;
            }

            .bottom-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: #2a2a2a;
                display: flex;
                justify-content: space-around;
                padding: 16px 0;
            }

            /* Bottom navigation buttons */
            .bottom-button {
                padding: 12px 28px;
                border-radius: 999px;
                font-weight: bold;
                background: #3a3a3a;
                color: #f8fafc;
            }

            /* Active bottom button */
            .bottom-button.active {
                background: #f8fafc;
                color: #111827;
            }
            
            .milestone-header{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:18px;
            }

            .add-milestone-btn{
                width:40px;
                height:40px;
                border:none;
                border-radius:50%;
                background:#6d95ea;
                color:white;
                font-size:24px;
                font-weight:bold;
                cursor:pointer;
                transition:0.2s;
            }

            .add-milestone-btn:hover{
                opacity:0.9;
            }

            .milestone-list{
                display:flex;
                flex-direction:column;
                gap:12px;
            }

            .milestone{
                background:#1a1a1a;
                border:1px solid #2a2a2a;
                border-radius:16px;
                padding:15px;
                display:flex;
                justify-content:space-between;
                align-items:center;
            }

            .milestone-info{
                flex:1;
            }

            .milestone-title{
                font-size:16px;
                font-weight:700;
                margin-bottom:6px;
            }

            .milestone-date{
                color:#8a8a8a;
                font-size:13px;
            }

            .complete-btn{
                border:none;
                border-radius:12px;
                padding:10px 16px;
                color:white;
                font-weight:bold;
                cursor:pointer;
                transition:0.2s;
            }

            .complete-btn:hover{
                opacity:0.9;
            }

            .complete-btn.pending{
                background:#6d95ea;
            }

            .complete-btn.completed{
                background:#2e7d32;
                cursor:default;
            }

            .modal{
                display:none;
                position:fixed;
                inset:0;
                background:rgba(0,0,0,.75);
                justify-content:center;
                align-items:center;
            }

            .modal-content{
                background:#111;
                border:1px solid #2a2a2a;
                border-radius:20px;
                padding:25px;
                width:90%;
                max-width:350px;
            }

            .modal-content h2{
                margin-bottom:15px;
            }

            .modal-content input{
                width:100%;
                margin-bottom:12px;
                padding:12px;
                border:none;
                border-radius:12px;
                background:#1a1a1a;
                color:white;
            }

            .modal-buttons{
                display:flex;
                gap:10px;
            }

            .modal-buttons button{
                flex:1;
                padding:12px;
                border:none;
                border-radius:12px;
                cursor:pointer;
            }

            #saveMilestone{
                background:#6d95ea;
                color:white;
            }

            #cancelMilestone{
                background:#333;
                color:white;
            }

            .delete-btn{
                background:#e53935;
                color:white;
                border:none;
                border-radius:12px;
                padding:10px 16px;
                margin-right:10px;
                cursor:pointer;
                transition:0.2s;
            }
        </style>
    </head>

    <body>

        <div class="container">

            <h1>Account</h1>

            <!-- Profile Card -->
            <div class="card profile-section">

                <div class="profile-pic">
                    <img src="profile.jpg" alt="Profile Picture">
                </div>

                <div class="username" id="username"></div>

                <div class="subtext" id="subtext">
                    Workout Consistency: 0 Weeks
                </div>

            </div>

            <!-- Milestones -->
            <div class="card">

                <div class="milestone-header">
                    <div class="section-title" style="margin-bottom:0;">
                        Milestones
                    </div>

                    <button class="add-milestone-btn" id="addMilestoneBtn">
                        +
                    </button>
                </div>

                <div class="milestone-list" id="milestoneList">
                    
                </div>
            </div>

            <!-- Buttons -->
            <button class="button settings-btn">
                Profile Settings
            </button>

            <button class="button signout-btn" id="signoutBtn">
                Sign Out
            </button>

            <nav class="bottom-nav">
                <button class="bottom-button active" onclick="location.href = 'index.html'">Home</button>
                <button class="bottom-button">Settings</button>
            </nav>

        </div>
        <!-- Add Milestone Modal -->
        <div id="milestoneModal" class="modal">

            <div class="modal-content">
                <h2>Add Milestone</h2>

                <input
                    type="text"
                    id="milestoneName"
                    placeholder="Milestone Name">

                <input
                    type="text"
                    id="milestoneGoal"
                    placeholder="Goal">

                <div class="modal-buttons">
                    <button id="saveMilestone">Save</button>
                    <button id="cancelMilestone">Cancel</button>
                </div>
            </div>

        </div>
        <script src="account.js" type="module"></script>
    </body>
</html>
